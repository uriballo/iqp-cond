[project]
name = "iqp-cond"
version = "0.1.0"
description = "Conditional IQP generation with classically tractable encoders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["quantum machine learning", "IQP circuits", "generative models", "JAX"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "numpy>=2.0",
    "optax>=0.2.8",
    "networkx>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]
# Independent statevector cross-checks; the tests skip when it is absent.
crosscheck = ["pennylane>=0.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqp_cond"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml", "/src", "/tests", "/examples"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The facade must enable JAX float64 before importing submodules.
"src/iqp_cond/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
